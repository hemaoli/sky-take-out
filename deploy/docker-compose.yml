services:
  mysql:
    image: mysql:8.0
    container_name: sky-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sky_take_out}
      MYSQL_USER: ${MYSQL_USER:-sky}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    container_name: sky-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 覆盖打包在 jar 里的 application-dev.yml（localhost -> mysql 容器）
      SKY_DATASOURCE_HOST: mysql
      SKY_DATASOURCE_PORT: 3306
      SKY_DATASOURCE_DATABASE: ${MYSQL_DATABASE:-sky_take_out}
      SKY_DATASOURCE_USERNAME: ${MYSQL_USER:-sky}
      SKY_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      # 阿里云 OSS，留空也能启动，但图片上传功能会不可用
      SKY_ALIOSS_ENDPOINT: ${SKY_ALIOSS_ENDPOINT:-}
      SKY_ALIOSS_ACCESS_KEY_ID: ${SKY_ALIOSS_ACCESS_KEY_ID:-}
      SKY_ALIOSS_ACCESS_KEY_SECRET: ${SKY_ALIOSS_ACCESS_KEY_SECRET:-}
      SKY_ALIOSS_BUCKET_NAME: ${SKY_ALIOSS_BUCKET_NAME:-}
      JAVA_OPTS: "${JAVA_OPTS:--Xmx512m -Xms256m}"
    ports:
      # 8080 用于调试/查看接口文档，不需要可删除
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    container_name: sky-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # HTTPS 证书：把证书文件放到 ./certs 后生效
      - ./certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
